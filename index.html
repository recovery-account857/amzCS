<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wadah-utama">
        <!-- Logo Amazon -->
        <div class="logo-amazon">
            <span class="teks-amazon">amazon</span>
            <span class="panah">↗</span>
        </div>

        <!-- Kotak Masuk -->
        <div class="kotak-masuk">
            <h1>Sign in</h1>
            
            <label for="email">Email or mobile phone number</label>
            <input type="text" id="email" name="email">
            
            <button type="button" class="tombol-lanjut">Continue</button>
            
            <p class="teks-syarat">
                By continuing, you agree to Amazon's 
                <a href="#">Conditions of Use</a> and 
                <a href="#">Privacy Notice</a>.
            </p>
            
            <p class="bantuan">
                <span>›</span> <a href="#">Need help?</a>
            </p>
            
            <div class="garis-pemisah">
                <span>Buying for work?</span>
            </div>
            
            <p class="tautan-bisnis">
                <a href="#">Shop on Amazon Business</a>
            </p>
        </div>

        <!-- Garis & Tombol Daftar -->
        <div class="bagian-daftar">
            <p class="teks-pemisah">New to Amazon?</p>
            <button type="button" class="tombol-daftar">Create your Amazon account</button>
        </div>

        <!-- Kaki Halaman -->
        <footer>
            <div class="tautan-kaki">
                <a href="#">Conditions of Use</a>
                <a href="#">Privacy Notice</a>
                <a href="#">Help</a>
            </div>
            <p class="hak-cipta">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
        </footer>
    </div>
</body>
</html>
